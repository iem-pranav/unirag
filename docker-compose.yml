# * Local services: Postgres + pgvector, the API, the UI and an MLflow server.
# * Load data from the host first (python -m unirag.load_data, then ingest); see the README.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # * Admin user: owns the tables and loads the data.
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      # * Password for the read-only app user (created by the init script).
      UNIRAG_RO_PASSWORD: ${UNIRAG_RO_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: unirag-app
    command: uvicorn unirag.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env  # LLM API keys
    environment:
      # ! The app always connects as the read-only user, here by service name.
      DATABASE_URL: postgresql://unirag_ro:${UNIRAG_RO_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: unirag-app  # same image as api, built once
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
      # * Settings require it, but the UI only talks to the API over HTTP.
      DATABASE_URL: postgresql://unirag_ro:${UNIRAG_RO_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow:
    # * Full MLflow image with a SQLite store. Evals log here with
    # * MLFLOW_TRACKING_URI=http://localhost:5000 python eval/run_eval.py --mlflow
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow:/mlflow

volumes:
  pgdata:
  mlflow:
