[project]
name = "unirag"
version = "0.1.0"
description = "Unified hybrid RAG over SQL tables and policy documents for a fictional university."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unirag"]

[tool.ruff]
target-version = "py311"
line-length = 100
# ! data/ is provided as-is (see CLAUDE.md), so we don't lint or reformat it.
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
