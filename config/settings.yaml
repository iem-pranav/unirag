# * App settings. Change values here, not in code. Secrets go in .env.

# * "Today" in the fake world. Used for deadlines and "upcoming" questions.
today: 2026-11-23

llm:
  # * Format: provider/model. Checked as served on 2026-11-23.
  primary: groq/openai/gpt-oss-120b
  fallback: gemini/gemini-3.8-flash
  timeout_s: 60
  # * Eval-only LLM cache. record: reuse cached replies, call + store on a miss (resumable).
  # * replay: cached replies only, a miss fails. off: no cache.
  cache: "off"  # ! quoted: bare off is a YAML boolean
  cache_dir: .cache/llm

router:
  # * llm or semantic. Phase 5 eval (70 questions): llm 89% (94% without a network blip),
  # * semantic 60%. llm also writes the sub-questions Phase 6 needs. Cost: ~700 tokens, ~1-2 s.
  type: llm

sql:
  max_rows: 100       # forced LIMIT on every query
  timeout_ms: 5000    # statement timeout per query

embedding:
  model: BAAI/bge-small-en-v1.5  # fastembed serves an int8-quantized ONNX build of it

retrieval:
  top_k: 5
  candidate_pool: 20  # how many chunks each of vector and keyword search hand to the fusion
  rrf_k: 60           # standard reciprocal rank fusion constant
  max_context_chunks: 8  # cap on merged chunks given to the synthesizer

synthesis:
  max_rows: 20  # SQL rows shown to the synthesizer

chunking:
  # * Characters, not tokens: no tokenizer needed. 1000 chars is about 250 tokens, under bge's 512.
  chunk_size: 1000

eval:
  number_tolerance: 0.01  # SQL eval: numbers this close count as equal
  # ! Groq free tier: 8000 tokens/min, and one text-to-SQL call is ~2.4k. Space calls out.
  pause_s: 20         # min seconds between live LLM calls in eval commands
  network_retry_s: 30 # eval: wait this long, then retry once when both providers fail
  # ! CI gate: the offline semantic router must keep at least this routing accuracy.
  # * Measured 49/80 (61%) on 2026-11-25; the margin absorbs tiny CPU float differences.
  ci_min_routing_accuracy: 0.55

mlflow:
  # * Eval runs log here only with --mlflow. The MLFLOW_TRACKING_URI env var wins (Compose server).
  dir: mlruns

api:
  url: http://localhost:8000  # where the Streamlit UI finds the API (env API_URL wins)

